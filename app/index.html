<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager Simple</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        button { padding: 10px 20px; font-size: 16px; margin-top: 20px; }
        .notification { margin-top: 20px; padding: 10px; background: #e0ffe0; display: none; }
    </style>
</head>
<body>
    <h1>Task Manager</h1>
    <h2>Complete Your Tasks</h2>
    
    <div id="task-list">
        <p>✅ Task 1: Set up repository</p>
        <p>✅ Task 2: Create HTML structure</p>
        <p>🔲 Task 3: Add notification system</p>
    </div>
    
    <!-- Button placeholder -->
    <div id="button-container">
    <button id="complete-btn">Complete Task</button>
</div>
    
    <!-- Notification placeholder -->
    <div id="notification-area">
    <div class="notification" id="notification-message">
        Task marked as complete! ✅
    </div>
</div>
    
    <script src="script.js"></script>
</body>
</html>
